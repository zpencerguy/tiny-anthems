databases:
  - name: tiny-anthems-db
    plan: basic-256mb

services:
  - type: keyvalue
    name: tiny-anthems-redis
    plan: starter
    ipAllowList: []

  - type: web
    name: tiny-anthems-web
    runtime: python
    plan: starter
    buildCommand: ./build.sh
    preDeployCommand: python manage.py migrate --no-input
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tiny-anthems-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: tiny-anthems-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: tiny-anthems-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: tiny-anthems-redis
          property: connectionString
      - key: CELERY_TASK_ALWAYS_EAGER
        value: false
      - key: STORAGE_BACKEND
        value: gcs
      - key: GCS_BUCKET_NAME
        sync: false
      - key: GCS_PROJECT_ID
        sync: false
      - key: GCS_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_CREDITS_1
        sync: false
      - key: STRIPE_PRICE_ID_CREDITS_2
        sync: false
      - key: STRIPE_PRICE_ID_CREDITS_3
        sync: false
      - key: STRIPE_PRICE_ID_CREDITS_4
        sync: false
      - key: STRIPE_PRICE_ID_CREDITS_5
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: DEFAULT_MUSIC_PROVIDER
        value: elevenlabs
      - key: ALLOW_MOCK_MUSIC_PROVIDER
        value: false
      - key: ELEVENLABS_MODEL_ID
        value: music_v1
      - key: ELEVENLABS_OUTPUT_FORMAT
        value: mp3_44100_128
      - key: ELEVENLABS_TIMEOUT_SECONDS
        value: 180
      - key: ELEVENLABS_USE_COMPOSITION_PLAN
        value: false
      - key: EMAIL_LOGIN_TOKEN_TTL_MINUTES
        value: 20
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: true

  - type: worker
    name: tiny-anthems-worker
    runtime: python
    plan: starter
    buildCommand: ./build.sh
    startCommand: celery -A config worker -l info
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: tiny-anthems-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: tiny-anthems-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: tiny-anthems-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: tiny-anthems-redis
          property: connectionString
      - key: CELERY_TASK_ALWAYS_EAGER
        value: false
      - key: STORAGE_BACKEND
        value: gcs
      - key: GCS_BUCKET_NAME
        sync: false
      - key: GCS_PROJECT_ID
        sync: false
      - key: GCS_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: DEFAULT_MUSIC_PROVIDER
        value: elevenlabs
      - key: ALLOW_MOCK_MUSIC_PROVIDER
        value: false
      - key: ELEVENLABS_MODEL_ID
        value: music_v1
      - key: ELEVENLABS_OUTPUT_FORMAT
        value: mp3_44100_128
      - key: ELEVENLABS_TIMEOUT_SECONDS
        value: 180
      - key: ELEVENLABS_USE_COMPOSITION_PLAN
        value: false
